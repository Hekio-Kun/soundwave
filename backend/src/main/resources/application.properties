spring.application.name=soundwave-backend
spring.config.import=optional:classpath:application-local.properties


spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=soundwave;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:hekio}
spring.datasource.password=${DB_PASSWORD:100605}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Gmail SMTP credentials must be provided through environment variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
app.security.remember-refresh-token-days=${REMEMBER_REFRESH_TOKEN_DAYS:30}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:4174,http://localhost:4174}
app.auth.otp-expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.auth.otp-resend-seconds=${OTP_RESEND_SECONDS:60}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
